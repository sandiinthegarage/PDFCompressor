<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kompresor PDF</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>📄 Kompresor PDF</h1>
      <p class="subtitle">Kompres PDF langsung di browser. Tanpa upload ke server.</p>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="theme-icon">🌙</span>
      </button>
    </header>

    <!-- Drop Zone -->
    <div class="drop-zone" id="dropZone">
      <div class="drop-icon">📁</div>
      <p class="drop-text">Seret file PDF ke sini</p>
      <p class="drop-subtext">atau</p>
      <button class="btn btn-primary" id="selectBtn">Pilih File</button>
      <input type="file" id="fileInput" accept=".pdf" multiple hidden>
    </div>

    <!-- File Queue -->
    <div class="file-queue" id="fileQueue" hidden>
      <h3>Antrean File (<span id="fileCount">0</span>)</h3>
      <ul id="fileList"></ul>
    </div>

    <!-- Presets -->
    <div class="presets">
      <h3>Preset</h3>
      <div class="preset-chips" id="presetChips">
        <button class="chip" data-preset="lossless">Lossless</button>
        <button class="chip" data-preset="high">High Quality</button>
        <button class="chip active" data-preset="balanced">Balanced</button>
        <button class="chip" data-preset="low">Low Quality</button>
        <button class="chip" data-preset="extreme">Extreme</button>
        <button class="chip" data-preset="extreme-bw">Extreme B/W</button>
        <button class="chip" data-preset="custom">Custom</button>
      </div>
    </div>

    <!-- Advanced Settings -->
    <details class="settings" id="settingsPanel">
      <summary>Pengaturan Lanjutan</summary>
      <div class="settings-grid">
        <div class="setting-group">
          <label for="dpiSlider">DPI: <span id="dpiValue">150</span></label>
          <input type="range" id="dpiSlider" min="50" max="300" step="5" value="150">
          <input type="number" id="dpiInput" min="50" max="300" value="150">
        </div>

        <div class="setting-group">
          <label for="qualitySlider">Kualitas JPEG: <span id="qualityValue">70</span>%</label>
          <input type="range" id="qualitySlider" min="1" max="100" value="70">
          <input type="number" id="qualityInput" min="1" max="100" value="70">
        </div>

        <div class="setting-group">
          <label for="colorMode">Mode Warna</label>
          <select id="colorMode">
            <option value="color">Warna</option>
            <option value="grayscale" selected>Grayscale</option>
            <option value="bw">Hitam-putih</option>
          </select>
        </div>

        <div class="setting-group bw-threshold" id="bwThresholdGroup" hidden>
          <label for="thresholdSlider">Threshold: <span id="thresholdValue">160</span></label>
          <input type="range" id="thresholdSlider" min="0" max="255" value="160">
          <input type="number" id="thresholdInput" min="0" max="255" value="160">
        </div>

        <div class="setting-group">
          <label for="maxSize">Maks. Sisi Gambar (px, opsional)</label>
          <input type="number" id="maxSize" placeholder="Contoh: 2000" min="100" max="10000">
        </div>

        <div class="setting-group">
          <label class="toggle-label">
            <input type="checkbox" id="autoFitToggle">
            Auto-fit ke Target
          </label>
          <input type="number" id="targetSize" value="1.8" min="0.1" max="100" step="0.1" hidden>
          <span id="targetUnit" hidden>MB</span>
        </div>
      </div>
    </details>

    <!-- Compress Button -->
    <div class="action-bar">
      <button class="btn btn-primary btn-large" id="compressBtn" disabled>Kompres PDF</button>
    </div>

    <!-- Progress -->
    <div class="progress-container" id="progressContainer" hidden>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-text" id="progressText">Memproses...</p>
      <button class="btn btn-danger" id="cancelBtn">Batal</button>
    </div>

    <!-- Results -->
    <div class="results" id="resultsContainer" hidden>
      <h3>Hasil Kompresi</h3>
      <div id="resultsList"></div>
      <button class="btn btn-primary" id="downloadAllBtn" hidden>Download Semua (ZIP)</button>
    </div>

    <footer>
      <p>💾 Semua diproses di perangkat Anda. Data tidak dikirim ke server manapun.</p>
    </footer>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
